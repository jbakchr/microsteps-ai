[project]
name = "microsteps-ai"
version = "0.1.0"
description = "CLI tool for generating micro-steps to reduce friction"
requires-python = ">=3.11"
dependencies = [
    "ollama"
]

[project.scripts]
microsteps = "interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["microsteps*", "interfaces*"]